name: Build ANGLE shared libraries for Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ANGLE Repository
        uses: actions/checkout@v4
        with:
          repository: Adiven-nataly/angle-for-android
          submodules: recursive

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build

      - name: Sync ANGLE Dependencies
        run: |
          gclient sync

      - name: Setup Android NDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: "25.2.9519653"

      - name: Generate GN Build Files
        run: |
          mkdir -p out/Android-arm64
          gn gen out/Android-arm64 --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            angle_shared_lib = true
            angle_build_all = false
          '

      - name: Build libEGL_angle.so
        run: |
          ninja -C out/Android-arm64 libEGL

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: libEGL_angle_android_arm64
          path: |
            out/Android-arm64/libEGL_angle.so
            out/Android-arm64/libGLESv2_angle.so
